{% extends "admin/base.html" %}{% block body %}<h2>Login &amp; password</h2><p class="sub">Change the admin username and password.</p>{% if err %}<div class="warn">{{ err }}</div>{% endif %}
<form class="panel" method="post" style="max-width:480px"><input type="hidden" name="_csrf" value="{{ csrf() }}">
<div class="fld"><label class="t">Username</label><input name="u" value="{{ cur }}"></div><div class="fld"><label class="t">Current password</label><input type="password" name="old" required></div>
<div class="fld"><label class="t">New password (min 8 characters)</label><input type="password" name="n" required></div><div class="fld"><label class="t">Repeat new password</label><input type="password" name="n2" required></div><button class="btn">Update</button></form>{% endblock %}
